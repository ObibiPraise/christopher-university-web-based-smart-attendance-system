<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="app-shell" class="screen app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-mark">R</div>
      <span class="sidebar-brand-name">Register</span>
    </div>

    <nav class="sidebar-nav" id="sidebar-nav"></nav>

    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-user-avatar" id="sidebar-user-avatar">—</div>
        <div class="sidebar-user-meta">
          <span class="sidebar-user-name" id="sidebar-user-name">—</span>
          <span class="sidebar-user-role" id="sidebar-user-role">—</span>
        </div>
      </div>
      <button id="logout-btn" class="sidebar-logout" title="Sign out">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </aside>

  <main class="main-area">
    <header class="topbar">
      <button id="mobile-nav-toggle" class="mobile-nav-toggle" aria-label="Toggle menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <h1 id="page-title" class="page-title">Dashboard</h1>
      <div class="topbar-date" id="topbar-date"></div>
    </header>

    <div class="view-container" id="view-container"></div>
  </main>
</div>

<div id="toast" class="toast" hidden></div>

<script src="js/store.js"></script>
<script src="js/auth.js"></script>
<script src="js/views.student.js"></script>
<script src="js/views.lecturer.js"></script>
<script src="js/views.admin.js"></script>
<script src="js/app.js"></script>
</body>
</html>
